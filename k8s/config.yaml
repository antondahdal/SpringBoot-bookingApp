# A ConfigMap is a Kubernetes object full of plain settings.
# It does not run a pod. The Deployment has to pull it into the container.
apiVersion: v1
kind: ConfigMap
metadata:
  # Event's Deployment will load this by this name.
  name: event-config
data:
  # Spring reads SPRING_DATASOURCE_URL as spring.datasource.url.
  # This is the database address, not the JWT key.
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventdb
  SPRING_DATASOURCE_USERNAME: booking
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-config
data:
  # Booking's own database address. Plain setting, same idea as Event.
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookingdb
  SPRING_DATASOURCE_USERNAME: booking
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  # Hostnames are the Service names, not pod IPs.
  AUTH_SERVICE_BASE_URL: http://auth:8082
  EVENT_SERVICE_BASE_URL: http://event:8083
---
# A Secret is the object for a key. It is not a ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  # Both Deployments load this same Secret by this name.
  name: app-secret
# stringData is plain text in this file so you can read it.
# Kubernetes stores it base64. Base64 is encoding, not encryption.
# The real key stays out of git. These two values are placeholders.
stringData:
  # Event and Booking already read this env name: ${JWT_SECRET}.
  JWT_SECRET: replace-me
  # Both apps already read ${APP_INTERNAL_TOKEN}.
  APP_INTERNAL_TOKEN: replace-me
  # Password for the Postgres user named in the ConfigMaps. Placeholder, same as Compose's local default.
  SPRING_DATASOURCE_PASSWORD: booking
