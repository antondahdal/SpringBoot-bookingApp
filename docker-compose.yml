services:
  booking:
    build: .
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your shell}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  gateway:
    build: ./gateway
    ports:
      - "8081:8081"
    environment:
      BOOKING_SERVICE_URI: http://booking:8080
      AUTH_SERVICE_URI: http://booking:8080
      EVENT_SERVICE_URI: http://booking:8080
    depends_on:
      booking:
        condition: service_healthy
