services:
  auth:
    build: ./auth
    ports:
      - "8082:8082"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your shell}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  event:
    build: ./event
    ports:
      - "8083:8083"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your shell}
      APP_INTERNAL_TOKEN: ${APP_INTERNAL_TOKEN:?set APP_INTERNAL_TOKEN in your shell}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  booking:
    build: .
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your shell}
      APP_INTERNAL_TOKEN: ${APP_INTERNAL_TOKEN:?set APP_INTERNAL_TOKEN in your shell}
      AUTH_SERVICE_BASE_URL: http://auth:8082
      EVENT_SERVICE_BASE_URL: http://event:8083
    depends_on:
      auth:
        condition: service_healthy
      event:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  gateway:
    build: ./gateway
    ports:
      - "8081:8081"
    environment:
      BOOKING_SERVICE_URI: http://booking:8080
      AUTH_SERVICE_URI: http://auth:8082
      EVENT_SERVICE_URI: http://event:8083
    depends_on:
      booking:
        condition: service_healthy
