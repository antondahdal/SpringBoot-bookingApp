services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking}
      POSTGRES_DB: postgres
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build: ./auth
    mem_limit: 512m
    ports:
      - "8082:8082"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your shell}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:3000,https://antondahdal.github.io}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/authdb
      SPRING_DATASOURCE_USERNAME: booking
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-booking}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  event:
    build: ./event
    mem_limit: 512m
    ports:
      - "8083:8083"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your shell}
      APP_INTERNAL_TOKEN: ${APP_INTERNAL_TOKEN:?set APP_INTERNAL_TOKEN in your shell}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:3000,https://antondahdal.github.io}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventdb
      SPRING_DATASOURCE_USERNAME: booking
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-booking}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  booking:
    build: .
    mem_limit: 512m
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your shell}
      APP_INTERNAL_TOKEN: ${APP_INTERNAL_TOKEN:?set APP_INTERNAL_TOKEN in your shell}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:3000,https://antondahdal.github.io}
      AUTH_SERVICE_BASE_URL: http://auth:8082
      EVENT_SERVICE_BASE_URL: http://event:8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookingdb
      SPRING_DATASOURCE_USERNAME: booking
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-booking}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
      event:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  gateway:
    build: ./gateway
    mem_limit: 512m
    ports:
      - "8081:8081"
    environment:
      BOOKING_SERVICE_URI: http://booking:8080
      AUTH_SERVICE_URI: http://auth:8082
      EVENT_SERVICE_URI: http://event:8083
      REDIS_HOST: redis
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:3000,https://antondahdal.github.io}
    depends_on:
      redis:
        condition: service_healthy
      booking:
        condition: service_healthy
