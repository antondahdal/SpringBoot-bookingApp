spring.application.name=event-booking-booking
spring.profiles.active=dev
management.endpoints.web.exposure.include=health

auth.service.base-url=http://localhost:8082
event.service.base-url=http://localhost:8083
app.internal.token=${APP_INTERNAL_TOKEN}
resilience4j.retry.instances.eventGet.maxAttempts=3
resilience4j.circuitbreaker.instances.event.slidingWindowSize=10
resilience4j.circuitbreaker.instances.event.failureRateThreshold=50
resilience4j.circuitbreaker.instances.event.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.event.ignoreExceptions= com.eventbooking.event_booking_platform.exception.InsufficientSeatsException,com.eventbooking.event_booking_platform.exception.ResourceNotFoundException 
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,metrics