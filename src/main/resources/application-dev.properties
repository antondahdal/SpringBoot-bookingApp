# Dev profile — H2 in-memory (Week 1–2)
spring.datasource.url=jdbc:h2:mem:eventbooking;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.org.hibernate.SQL=DEBUG

# JWT — HS256 needs a secret >= 32 bytes. Set JWT_SECRET in the run configuration. No default on purpose.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

